name: Cypress tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Запустити Cypress
        run: npx cypress run